[package]
name = "gzc-gpu"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
gzc-core = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
anyhow = { workspace = true }
# The Vulkan types behind wgpu-hal's escape hatches (same version wgpu-hal 30 uses): the ReBAR
# probe (`context::rebar`) and the extra queues of the multi-queue path.
ash = "0.38"
# wgpu's own naga (same version): `GZC_EMULATE_SHIFT_MOD32` rewrites shaders through it
# (`context::shift_mod32_wgsl`).
naga = { version = "30", features = ["wgsl-in", "wgsl-out"] }

# wgpu-hal only exports its Vulkan API types (`hal::api::Vulkan`, used by the transfer-queue and
# ReBAR paths) when its `vulkan` backend is compiled, which on Apple targets needs
# `vulkan-portability`. It only makes those paths compile: `GpuContext::new` still picks Metal on
# Apple (unless WGPU_BACKEND says otherwise), and a Metal adapter takes the non-Vulkan fallbacks.
[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { workspace = true, features = ["vulkan-portability"] }

[dev-dependencies]
zstd = { workspace = true }
