[workspace]
resolver = "3"
members = ["crates/gzc-core", "crates/gzc-gpu", "crates/gzc-bench", "tools/fetch-corpus"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.96"

[workspace.dependencies]
gzc-core = { path = "crates/gzc-core" }
gzc-gpu = { path = "crates/gzc-gpu" }
wgpu = "30"
zstd = "0.14"
pollster = "1"
rayon = "1.12"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytemuck = { version = "1.25", features = ["derive"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
toml = "1"
ba2 = "3"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[profile.release]
debug = 1

[profile.test]
opt-level = 2
